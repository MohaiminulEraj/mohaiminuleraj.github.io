<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0a0e14"/>
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- ~ (tilde) -->
  <path d="M 14 40 C 19 28, 31 28, 36 38 C 41 48, 53 48, 58 36"
