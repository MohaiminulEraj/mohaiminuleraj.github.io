        stroke="#00d4ff" stroke-width="9" stroke-linecap="round"/>

  <!-- status dot -->
  <circle cx="78" cy="76" r="9" fill="#00ff88"/>
  <circle cx="78" cy="76" r="9" fill="none" stroke="#0a0e14" stroke-width="3"/>
